name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Nix Checks & Portable Cross Build
    runs-on: ubuntu-latest
    env:
      ATTIC_ENDPOINT: ${{ vars.ATTIC_ENDPOINT || secrets.ATTIC_ENDPOINT }}
      ATTIC_CACHE: ${{ vars.ATTIC_CACHE || secrets.ATTIC_CACHE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reclaim disk space with Nothing but Nix
        uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12
        with:
          hatchet-protocol: cleave

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1
        with:
          extra-conf: |
            build-dir = /nix/build

      - name: Setup Attic cache
        if: ${{ env.ATTIC_ENDPOINT != '' && env.ATTIC_CACHE != '' }}
        uses: ryanccn/attic-action@dc99f5eb1d5c0495aa26f7b56337b30011fa153e # v0
        with:
          endpoint: ${{ env.ATTIC_ENDPOINT }}
          cache: ${{ env.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}
          inputs-from: .
          skip-push: ${{ github.event_name == 'pull_request' || secrets.ATTIC_TOKEN == '' }}

      - name: Run Nix flake checks
        run: nix flake check --print-build-logs

      - name: Build portable packages
        run: |
          for target in linux-amd64 linux-arm64 windows-amd64 windows-arm64; do
            nix build ".#portable-$target" -o "result-$target" --print-build-logs
            mkdir -p "dist/$target"
            cp -L "result-$target/lib/cliproxyapi/plugins/${target%-*}/${target#*-}/"* "result-$target/include/"* "dist/$target/"
          done

      - name: Upload portable artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cpa-reductant-portable
          path: dist/
          if-no-files-found: error

  native-linux:
    name: Non-Nix Linux Build & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare patched Magpie
        run: bash scripts/prepare.sh

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests with race detector
        run: go test -race ./internal/...

      - name: Build shared library via scripts/build.sh
        run: |
          set -euo pipefail
          bash scripts/build.sh dist/native
          test -s dist/native/cpa-reductant.so

  darwin:
    name: Build & Test darwin/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: macos-15-intel
            cgo_cflags: -march=x86-64
          - goarch: arm64
            runner: macos-15
            cgo_cflags: -march=armv8-a
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare patched Magpie
        run: bash scripts/prepare.sh

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests with race detector
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CGO_CFLAGS: ${{ matrix.cgo_cflags }}
        run: go test -race ./internal/...

      - name: Build shared library
        env:
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: v1
          GOARM64: v8.0
          CGO_ENABLED: '1'
          CGO_CFLAGS: ${{ matrix.cgo_cflags }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          out="dist/darwin_${{ matrix.goarch }}"
          mkdir -p "$out"
          go build -buildvcs=false -buildmode=c-shared -trimpath \
            -ldflags "-s -w -X github.com/moraxyc/cpa-reductant/internal/config.Version=${version}" \
            -o "${out}/cpa-reductant.dylib" ./cmd/plugin
          rm -f "${out}/cpa-reductant.h"
          if otool -L "${out}/cpa-reductant.dylib" | grep -qE '/(opt/homebrew|usr/local|nix/store)/'; then
            otool -L "${out}/cpa-reductant.dylib" >&2
            exit 1
          fi

      - name: Upload darwin artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cpa-reductant-darwin-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
