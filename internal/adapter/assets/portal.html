<!doctype html>
<html lang="__INITIAL_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cpa-reductant Status Dashboard</title>
<style>
/*__DASHBOARD_CSS__*/
.auth-wrap{max-width:460px;margin:48px auto}
.auth-form{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.input{flex:1;min-width:200px;padding:7px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:13px/1.4 var(--mono)}
.hidden{display:none!important}
body.embedded{padding-top:88px}
body.embedded .auth-wrap{margin-top:12px}
@media (max-width:768px){body.embedded{padding-top:72px}}
</style>
</head>
<body>
<div id="auth-card" class="card auth-wrap">
  <div class="header">
    <div class="title-row">
      <h1>cpa-reductant</h1>
      <span class="badge badge-amber"><span class="dot"></span><span data-i18n="auth.badge"></span></span>
    </div>
    <select class="select lang-select" data-i18n-title="lang.label" data-i18n-aria="lang.label"></select>
  </div>
  <div class="sub" style="margin-top:8px">
    <span data-i18n="auth.instructions"></span> <span data-i18n="auth.storage_notice"></span>
  </div>
  <form id="auth-form" class="auth-form">
    <input id="secret-input" class="input" type="password" autocomplete="current-password" data-i18n-placeholder="auth.placeholder" required>
    <button id="auth-submit" class="btn active" type="submit" data-i18n="auth.submit"></button>
  </form>
  <div id="auth-err" class="err-box hidden"></div>
</div>

<div id="app" class="wrap hidden">
  <div class="card">
    <div class="header">
      <div>
        <div class="title-row">
          <h1>cpa-reductant</h1>
          <span id="health-badge" class="badge badge-blue"></span>
          <span id="version-badge" class="badge badge-muted mono"></span>
        </div>
        <div id="time-sub" class="sub" style="margin-top:4px"></div>
      </div>
      <div class="actions">
        <button id="auto-refresh-btn" class="btn" type="button" onclick="toggleAutoRefresh()"></button>
        <button class="btn" type="button" onclick="loadStatus()" data-i18n="header.refresh"></button>
        <button class="btn" type="button" onclick="openJSON()">JSON</button>
        <button class="btn" type="button" onclick="disconnectKey()" data-i18n="auth.sign_out"></button>
        <select class="select lang-select" data-i18n-title="lang.label" data-i18n-aria="lang.label"></select>
      </div>
    </div>
    <div id="policy-chips" class="chips"></div>
    <div id="runtime-errors"></div>
  </div>

  <div class="card" data-fold="model">
    <div class="card-head">
      <button class="fold-btn" type="button" aria-expanded="true">
        <span class="fold-arrow" aria-hidden="true"></span>
        <span class="fold-label"><span data-i18n="model.title"></span> <span class="sub" data-i18n="model.description"></span></span>
      </button>
      <span class="actions">
        <span id="model-status-badge" class="badge badge-muted" data-i18n="common.loading"></span>
        <button id="model-download-btn" class="btn hidden" type="button" onclick="downloadModelWeights()" data-i18n="model.download"></button>
      </span>
    </div>
    <div class="card-body">
    <div id="model-details" class="kv-grid"></div>
    <div id="model-progress" class="hidden" style="margin-top:10px"></div>
    <div id="model-notice"></div>
    <details id="model-guide" class="guide-box">
      <summary data-i18n="model.guide.title"></summary>
      <div id="model-guide-body"></div>
    </details>
    </div>
  </div>

  <div id="kpi-grid" class="grid-4"></div>

  <div class="grid-2">
    <div class="card" data-fold="kinds">
      <div class="card-head">
        <button class="fold-btn" type="button" aria-expanded="true">
          <span class="fold-arrow" aria-hidden="true"></span>
          <span class="fold-label" data-i18n="kind.title"></span>
        </button>
      </div>
      <div class="card-body">
        <div id="kind-bars"></div>
      </div>
    </div>
    <div class="card" data-fold="finders">
      <div class="card-head">
        <button class="fold-btn" type="button" aria-expanded="true">
          <span class="fold-arrow" aria-hidden="true"></span>
          <span class="fold-label" data-i18n="finder.title"></span>
        </button>
      </div>
      <div class="card-body">
        <div id="finder-bars"></div>
      </div>
    </div>
  </div>

  <div class="grid-2">
    <div class="card" data-fold="protocols">
      <div class="card-head">
        <button class="fold-btn" type="button" aria-expanded="true">
          <span class="fold-arrow" aria-hidden="true"></span>
          <span class="fold-label" data-i18n="table.protocol_title"></span>
        </button>
      </div>
      <div class="card-body">
        <div id="protocol-table"></div>
      </div>
    </div>
    <div class="card" data-fold="models">
      <div class="card-head">
        <button class="fold-btn" type="button" aria-expanded="true">
          <span class="fold-arrow" aria-hidden="true"></span>
          <span class="fold-label" data-i18n="table.model_title"></span>
        </button>
      </div>
      <div class="card-body">
        <div id="model-table"></div>
      </div>
    </div>
  </div>

  <div class="card" data-fold="events">
    <div class="card-head">
      <button class="fold-btn" type="button" aria-expanded="true">
        <span class="fold-arrow" aria-hidden="true"></span>
        <span class="fold-label"><span data-i18n="events.title"></span> <span id="events-count" class="sub"></span></span>
      </button>
      <span id="event-filters" class="actions"></span>
    </div>
    <div class="card-body">
      <div id="events-table"></div>
    </div>
  </div>

  <div class="card" data-fold="capture">
    <div class="card-head">
      <button class="fold-btn" type="button" aria-expanded="true">
        <span class="fold-arrow" aria-hidden="true"></span>
        <span class="fold-label"><span data-i18n="capture.title"></span> <span class="sub" data-i18n="capture.description"></span></span>
      </button>
      <span class="actions">
        <span id="cap-badge" class="badge badge-muted" data-i18n="capture.disabled"></span>
        <select id="cap-ttl" class="select" data-i18n-title="capture.ttl" data-i18n-aria="capture.ttl">
          <option value="60"></option>
          <option value="300" selected></option>
          <option value="900"></option>
          <option value="1800"></option>
        </select>
        <button id="cap-toggle-btn" class="btn" type="button" onclick="toggleCapture()" data-i18n="capture.start"></button>
        <button class="btn" type="button" onclick="loadCapture(true)" data-i18n="capture.refresh"></button>
        <button class="btn" type="button" onclick="clearCapture()" data-i18n="capture.clear"></button>
      </span>
    </div>
    <div class="card-body">
      <div class="sub" data-i18n="capture.curl_usage"></div>
      <div id="cap-err" class="err-box hidden"></div>
      <div id="cap-list" class="cap-list"><div class="empty" data-i18n="capture.not_started"></div></div>
    </div>
  </div>

  <div class="card" data-fold="preview">
    <div class="card-head">
      <button class="fold-btn" type="button" aria-expanded="true">
        <span class="fold-arrow" aria-hidden="true"></span>
        <span class="fold-label"><span data-i18n="preview.title"></span> <span class="sub" data-i18n="preview.description"></span></span>
      </button>
    </div>
    <div class="card-body">
      <div class="actions" style="margin-bottom:8px;flex-wrap:wrap">
        <select id="preview-mode" class="select" data-i18n-aria="preview.mode_label">
          <option value="text" data-i18n="preview.mode_text"></option>
          <option value="json" data-i18n="preview.mode_json"></option>
        </select>
        <input id="preview-model" class="select mono" type="text" style="min-width:170px" data-i18n-placeholder="preview.model_placeholder">
        <input id="preview-words" class="select mono" type="text" style="min-width:170px" data-i18n-placeholder="preview.words_placeholder">
        <input id="preview-allow" class="select mono" type="text" style="min-width:170px" data-i18n-placeholder="preview.allow_placeholder">
        <label class="sub" style="display:inline-flex;align-items:center;gap:4px;cursor:pointer"><input id="preview-shape" type="checkbox"> <span data-i18n="preview.shape_toggle"></span></label>
      </div>
      <textarea id="preview-input" data-i18n-placeholder="preview.placeholder"></textarea>
      <div class="actions" style="margin-top:8px">
        <button class="btn" type="button" onclick="runPreview()" data-i18n="preview.test"></button>
        <span id="preview-meta" class="sub"></span>
      </div>
      <div id="preview-out" class="preview-out"></div>
    </div>
  </div>
</div>

<script>
(function(){
  try{
    if(window.self !== window.top){
      document.body.classList.add('embedded');
    }
  }catch(_){
    document.body.classList.add('embedded');
  }
  var KEY_STORAGE = 'cpa_reductant_mgmt_key';
  var STATUS_URL = '/v0/management/cpa-reductant/status';
  var PREVIEW_URL = '/v0/management/cpa-reductant/preview';
  var DEBUG_CAPTURE_URL = '/v0/management/cpa-reductant/debug/capture';
  var MODEL_DOWNLOAD_URL = '/v0/management/cpa-reductant/model/download';
  var LANG_STORAGE = '__LANG_COOKIE__';
  var I18N_BUNDLE = /*__I18N_BUNDLE__*/;
  var I18N_LOCALES = /*__I18N_LOCALES__*/;
  var FINDER_META = {rule:'finder.rule',yours:'finder.yours',word:'finder.word',model:'finder.model',known:'finder.known'};
  var ACTION_FILTERS = ['', 'mask', 'warn', 'block', 'restore', 'passthrough', 'error'];

  var state = {
    key: '',
    lang: resolveLang(),
    actionFilter: '',
    autoTimer: null,
    dlPollTimer: null,
    lastStatus: null,
    lastCapture: null,
    lastPreview: null,
    previewPending: false,
    errors: {},
    captureEnabled: false,
    openCaptures: {},
    modelGuideInit: false
  };

  function esc(v){
    return String(v == null ? '' : v)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  function normalizeLang(raw){
    var code = String(raw || '').trim().toLowerCase();
    if(code.startsWith('zh')) return 'zh-CN';
    if(code.startsWith('en')) return 'en';
    return '';
  }

  function resolveLang(){
    var query = normalizeLang(new URLSearchParams(window.location.search).get('lang'));
    if(query) return query;
    try{
      var stored = normalizeLang(localStorage.getItem(LANG_STORAGE));
      if(stored) return stored;
    }catch(_){}
    var cookie = document.cookie.split(';').map(function(entry){ return entry.trim(); })
      .find(function(entry){ return entry.startsWith(LANG_STORAGE + '='); });
    return normalizeLang(cookie && cookie.slice(LANG_STORAGE.length + 1)) ||
      (navigator.languages || []).concat(navigator.language).map(normalizeLang).find(Boolean) ||
      normalizeLang(document.documentElement.lang) || 'en';
  }

  function t(key, vars){
    var msg = I18N_BUNDLE[state.lang]?.[key] ?? I18N_BUNDLE.en[key] ?? key;
    return vars ? msg.replace(/\{(\w+)\}/g, function(match, name){ return vars[name] ?? match; }) : msg;
  }

  function textHTML(key, vars){
    return esc(t(key, vars));
  }

  function monoText(key, vars){
    return esc(t(key)).replace(/\{(\w+)\}/g, function(_, name){
      return '<span class="mono">' + esc(vars[name]) + '</span>';
    });
  }

  function applyStaticI18n(){
    document.documentElement.lang = state.lang;
    document.title = t('page.title');
    document.querySelectorAll('.lang-select').forEach(function(select){ select.value = state.lang; });
    var rich = {
      'auth.instructions': {setting: 'management.secret-key'},
      'capture.curl_usage': {curl: 'curl', endpoint: DEBUG_CAPTURE_URL}
    };
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.dataset.i18n;
      if(rich[key]) el.innerHTML = monoText(key, rich[key]);
      else el.textContent = t(key);
    });
    [['placeholder', 'placeholder'], ['title', 'title'], ['aria', 'aria-label']].forEach(function(pair){
      var attr = 'data-i18n-' + pair[0];
      document.querySelectorAll('[' + attr + ']').forEach(function(el){ el.setAttribute(pair[1], t(el.getAttribute(attr))); });
    });
    document.querySelectorAll('#cap-ttl option').forEach(function(option){
      option.textContent = t('capture.ttl_minutes', {count: Number(option.value) / 60});
    });
    renderAutoRefresh();
    renderPreviewMeta();
  }

  function setLang(code){
    var lang = normalizeLang(code);
    if(!lang) return;
    state.lang = lang;
    try{ localStorage.setItem(LANG_STORAGE, lang); }catch(_){}
    document.cookie = LANG_STORAGE + '=' + encodeURIComponent(lang) + '; path=/; max-age=31536000; SameSite=Lax';
    applyStaticI18n();
    if(state.key){
      if(state.lastStatus) renderStatus(state.lastStatus);
      if(state.lastCapture) renderCapture(state.lastCapture);
      if(state.lastPreview) renderPreview(state.lastPreview);
    }
    Object.keys(state.errors).forEach(renderError);
  }

  function initLanguage(){
    document.querySelectorAll('.lang-select').forEach(function(select){
      I18N_LOCALES.forEach(function(locale){ select.add(new Option(locale.label, locale.code)); });
      select.onchange = function(){ setLang(select.value); };
    });
    applyStaticI18n();
  }

  function fmtMS(v){
    var n = Number(v || 0);
    if(!n) return '0 ms';
    return n < 1 ? n.toFixed(2)+' ms' : n.toFixed(1)+' ms';
  }

  function fmtBytes(b){
    var n = Number(b || 0);
    if(n < 1024) return n + ' B';
    var units = ['KiB','MiB','GiB','TiB'];
    var exp = 0;
    var div = 1024;
    while(n / div >= 1024 && exp < units.length - 1){
      div *= 1024;
      exp++;
    }
    return (n / div).toFixed(1) + ' ' + units[exp];
  }

  function fmtDuration(sec){
    var s = Number(sec || 0);
    if(s < 60) return s + 's';
    if(s < 3600) return Math.floor(s / 60) + 'm' + (s % 60) + 's';
    return Math.floor(s / 3600) + 'h' + Math.floor((s % 3600) / 60) + 'm';
  }

  function shortTime(ts){
    if(!ts) return '';
    var d = new Date(ts);
    if(isNaN(d.getTime())) return ts;
    var pad = function(n){ return n < 10 ? '0' + n : '' + n; };
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function pctString(num, den){
    if(!den || den <= 0) return '0%';
    return ((num * 100) / den).toFixed(1) + '%';
  }

  function phaseLabel(p){
    switch(String(p || '').toLowerCase()){
      case 'request': return t('phase.request');
      case 'response': return t('phase.response');
      case 'stream': return t('phase.stream');
      case 'model': return t('phase.model');
      default: return p || '';
    }
  }

  function actionLabel(a){
    switch(String(a || '').toLowerCase()){
      case 'block': return t('action.block');
      case 'warn': return t('action.warn');
      case 'mask': return t('action.mask');
      case 'restore': return t('action.restore');
      case 'passthrough': return t('action.passthrough');
      case 'error': return t('action.error');
      case 'degraded': return t('action.degraded');
      default: return a || '';
    }
  }

  function actionClass(a){
    switch(String(a || '').toLowerCase()){
      case 'block': case 'error': case 'degraded': return 'badge-red';
      case 'warn': return 'badge-amber';
      case 'mask': return 'badge-blue';
      case 'restore': return 'badge-green';
      default: return 'badge-muted';
    }
  }

  function deriveHealth(st){
    var m = st.model || {};
    var s = st.stats || {};
    if(m.enabled){
      if(m.last_error || m.download_error) return [t('health.model_error'),'badge-red'];
      if(m.downloading) return [t('health.model_downloading'),'badge-amber'];
      if(m.behind) return [t('health.model_busy'),'badge-amber'];
      if(!m.installed) return [m.strict ? t('health.weights_missing_strict') : t('health.weights_missing_fallback'),'badge-amber'];
    }
    if((s.requests_total || 0) > 0) return [t('health.running'),'badge-green'];
    return [t('health.idle'),'badge-blue'];
  }

  function renderError(id){
    var el = document.getElementById(id);
    var error = state.errors[id];
    var msg = error ? t(error.key, error.vars) : '';
    if(el.classList.contains('err-box')){
      el.textContent = msg;
      el.classList.toggle('hidden', !error);
    } else {
      el.innerHTML = error ? '<div class="err-box">' + esc(msg) + '</div>' : '';
    }
  }

  function setError(id, key, vars){
    if(key) state.errors[id] = {key: key, vars: vars};
    else delete state.errors[id];
    renderError(id);
  }

  function showAuth(key, vars){
    stopAutoRefresh();
    stopDownloadPoll();
    state.key = '';
    try{ sessionStorage.removeItem(KEY_STORAGE); }catch(_){}
    document.getElementById('app').classList.add('hidden');
    document.getElementById('auth-card').classList.remove('hidden');
    setError('auth-err', key, vars);
  }

  function showApp(){
    document.getElementById('auth-card').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
  }

  function tableHead(keys){
    return '<table><thead><tr>' + keys.map(function(key){ return '<th>' + textHTML(key) + '</th>'; }).join('') + '</tr></thead><tbody>';
  }

  function renderBars(elId, counts, emptyKey, metaMap){
    var el = document.getElementById(elId);
    var entries = Object.entries(counts || {}).filter(function(kv){ return kv[1] > 0; });
    if(!entries.length){
      el.innerHTML = '<div class="empty">' + textHTML(emptyKey) + '</div>';
      return;
    }
    var total = entries.reduce(function(acc, kv){ return acc + kv[1]; }, 0);
    entries.sort(function(a, b){ return b[1] === a[1] ? (a[0] < b[0] ? -1 : 1) : b[1] - a[1]; });
    el.innerHTML = '<div class="bar-list">' + entries.map(function(kv){
      var pct = ((kv[1] * 100) / total).toFixed(1);
      var meta = metaMap && metaMap[kv[0]] ? ' <span class="sub">' + textHTML(metaMap[kv[0]]) + '</span>' : '';
      return '<div class="bar-row">' +
        '<div class="bar-head"><span class="mono"><strong>' + esc(kv[0]) + '</strong>' + meta + '</span>' +
        '<span class="mono">' + kv[1] + ' (' + pct + '%)</span></div>' +
        '<div class="bar-track"><div class="bar-fill' + (metaMap ? ' green' : '') + '" style="width:' + pct + '%"></div></div>' +
      '</div>';
    }).join('') + '</div>';
  }

  function renderDimTable(elId, dims, label, emptyKey){
    var el = document.getElementById(elId);
    var entries = Object.entries(dims || {});
    if(!entries.length){
      el.innerHTML = '<div class="empty">' + textHTML(emptyKey) + '</div>';
      return;
    }
    entries.sort(function(a, b){
      var ra = a[1].requests || 0, rb = b[1].requests || 0;
      return rb === ra ? (a[0] < b[0] ? -1 : 1) : rb - ra;
    });
    el.innerHTML = tableHead([label, 'table.requests', 'table.masked_blocked', 'table.hits', 'table.restored', 'table.inbound']) +
      entries.map(function(kv){
        var d = kv[1] || {};
        return '<tr>' +
          '<td class="mono"><strong>' + esc(kv[0]) + '</strong></td>' +
          '<td class="mono">' + (d.requests || 0) + '</td>' +
          '<td class="mono">' + (d.masked || 0) + ' / ' + (d.blocked || 0) + '</td>' +
          '<td class="mono">' + (d.hits || 0) + '</td>' +
          '<td class="mono">' + (d.placeholders_restored || 0) + '</td>' +
          '<td class="mono">' + fmtBytes(d.bytes_in || 0) + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table>';
  }

  function renderStatus(st){
    state.lastStatus = st;
    var health = deriveHealth(st);
    var hb = document.getElementById('health-badge');
    hb.className = 'badge ' + health[1];
    hb.innerHTML = '<span class="dot"></span>' + esc(health[0]);
    document.getElementById('version-badge').textContent = 'v' + (st.version || '');

    var tsHtml = [
      monoText('header.started_at', {time: st.started_at}),
      monoText('header.uptime', {duration: fmtDuration(st.uptime_seconds)}),
      st.last_activity_at ? monoText('header.last_request', {time: st.last_activity_at}) : textHTML('header.no_requests')
    ];
    if(st.last_reconfigured_at) tsHtml.push(monoText('header.last_reload', {time: st.last_reconfigured_at}));
    document.getElementById('time-sub').innerHTML = tsHtml.join(' · ');

    var p = st.policy || {};
    var m = st.model || {};
    var dlPct = m.download_total > 0 ? Math.round((m.download_done || 0) * 100 / m.download_total) : 0;
    var keyStatus = !p.key_path_configured ? t('policy.key_temporary') : t(p.key_path_active ? 'policy.key_persisted' : 'policy.key_failed');
    var modelStatus = !m.enabled ? t('model.disabled') : (m.name || '') + ' · ' + (
      m.loaded ? t('model.loaded', {count: m.cores || 0}) :
      m.downloading ? t('model.downloading', {percent: dlPct}) :
      t(m.installed ? 'model.ready' : 'model.missing')
    );
    document.getElementById('policy-chips').innerHTML = [
      ['policy.secrets', t(p.secrets ? 'policy.on' : 'policy.off')],
      ['policy.personal', t(p.personal ? 'policy.on' : 'policy.off')],
      ['policy.words', p.words_count || 0],
      ['policy.rules', p.rules_count || 0],
      ['policy.allowlist', p.allow_count || 0],
      ['policy.replacement', t(p.shape ? 'policy.shape_preserving' : 'policy.placeholder')],
      ['policy.hmac_key', keyStatus],
      ['policy.model', modelStatus]
    ].map(function(c){ return '<span class="chip"><strong>' + textHTML(c[0]) + ':</strong> ' + esc(c[1]) + '</span>'; }).join('');

    var errs = [];
    if(p.key_path_error) errs.push(t('policy.key_error', {error: p.key_path_error}));
    if(m.last_error) errs.push(t('model.error', {error: m.last_error}) + (m.retry_at ? t('model.retry_at', {time: m.retry_at}) : ''));
    if(m.download_error) errs.push(t('model.download_error', {error: m.download_error}));
    if(m.disk_cache_error) errs.push(t('model.disk_cache_error', {error: m.disk_cache_error}));
    document.getElementById('runtime-errors').innerHTML = errs.map(function(e){
      return '<div class="err-box">' + esc(e) + '</div>';
    }).join('');

    renderModelCard(m);

    var s = st.stats || {};
    var ml = s.mask_latency_ms || {};
    var rl = s.restore_latency_ms || {};
    var il = m.infer_latency_ms || {};
    var restoredCount = textHTML('kpi.restored_count').split('{count}');

  window.downloadModelWeights = async function(){

    try{

        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + state.key,
          'Content-Type': 'application/json'
        },
        body: '{}'
      });
      if(resp.status === 401 || resp.status === 403){
        showAuth('auth.denied', {status: resp.status});
        return;
      }
      var data = await resp.json();
      if(!resp.ok){
        setError('model-notice', 'model.download_start_failed', {error: data.error || ('HTTP ' + resp.status)});
        return;
      }
      await window.loadStatus();

  window.loadStatus = async function(){
    if(!state.key) return;
    var url = STATUS_URL + '?events=50' + (state.actionFilter ? '&action=' + encodeURIComponent(state.actionFilter) : '');
    try{
      var resp = await fetch(url, {
        headers: {'Authorization': 'Bearer ' + state.key, 'Accept': 'application/json'}
      });
      if(resp.status === 401 || resp.status === 403){
        showAuth('auth.denied', {status: resp.status});
        return;
      }
      var data = await resp.json();
      if(!resp.ok){
        showStatusError(data.error || ('HTTP ' + resp.status));
        return;
      }
      showApp();
      setError('auth-err');
      delete state.errors['runtime-errors'];
      delete state.errors['model-notice'];
      renderStatus(data);
      window.loadCapture();
    }catch(e){
      showStatusError(e);
    }
  };

  function renderCapture(snap){

    state.captureEnabled = !!(snap && snap.enabled);
    var badge = document.getElementById('cap-badge');
    var btn = document.getElementById('cap-toggle-btn');
    var entries = (snap && snap.entries) || [];

      badge.className = 'badge badge-amber';

      btn.className = 'btn active';
      btn.textContent = t('capture.stop');
    }else{
      badge.className = 'badge badge-muted';
      badge.textContent = t('capture.cached', {count: entries.length});

      var reps = ev.replacements || [];
      var restored = ev.restored_items || [];
      var repHtml = reps.length ? (tableHead(['capture.original', 'capture.replacement', 'capture.kind', 'capture.finder', 'capture.action']) +
        reps.map(function(r){
          var orig = r.original ? '<span class="orig-val">' + esc(r.original) + '</span>' : '<span class="sub">' + textHTML('capture.warn_only') + '</span>';
          return '<tr><td class="mono">' + orig + '</td><td class="mono ph-val">' + esc(r.placeholder || '-') + '</td><td class="mono">' + esc(r.kind) + '</td><td class="mono">' + esc(r.by || '-') + '</td><td class="mono">' + esc(actionLabel(r.action || 'mask')) + '</td></tr>';
        }).join('') + '</tbody></table>') : '<div class="sub">' + textHTML('capture.no_replacements') + '</div>';
      var resHtml = restored.length ? (tableHead(['capture.placeholder', 'capture.restored_text', 'capture.occurrences']) +
        restored.map(function(r){
          return '<tr><td class="mono ph-val">' + esc(r.placeholder) + '</td><td class="mono orig-val">' + esc(r.original || '-') + '</td><td class="mono">' + (r.count || 0) + '</td></tr>';
        }).join('') + '</tbody></table>') : '';
      var statusBadge = '';
      if(ev.status === 'streaming') statusBadge = '<span class="badge badge-amber">' + textHTML('capture.streaming') + '</span>';
      else if(ev.status === 'pending') statusBadge = '<span class="badge badge-muted">' + textHTML('capture.pending') + '</span>';
      else if(ev.status === 'error') statusBadge = '<span class="badge badge-red">' + textHTML('capture.failed') + '</span>';
      var upText = ev.response_binary ? t('capture.binary_response', {content_type: ev.response_content_type || '', size: fmtBytes(ev.upstream_response_bytes)}) : (prettyText(ev.upstream_response) || (ev.status === 'streaming' ? t('capture.waiting_for_data') : ''));
      var reText = ev.response_binary ? t('capture.binary_response', {content_type: ev.response_content_type || '', size: fmtBytes(ev.restored_response_bytes)}) : (prettyText(ev.restored_response) || (ev.status === 'streaming' ? t('capture.waiting_for_output') : ''));
      return '<details class="cap-item" data-cap-id="' + ev.id + '"' + openAttr + '>' +
        '<summary class="cap-summary">' +
          '<span class="mono"><strong>#' + ev.id + '</strong> ' + esc(shortTime(ev.timestamp)) + ' · ' + esc(ev.protocol || '-') + (ev.model ? ' / ' + esc(ev.model) : '') + (ev.stream ? ' [SSE]' : '') + '</span>' +
          '<span class="actions">' + statusBadge + '<span class="badge ' + actionClass(ev.action) + '">' + esc(actionLabel(ev.action)) + '</span><span class="sub mono">' + textHTML('capture.summary', {replaced: reps.length, restored: ev.restored_count || 0}) + '</span></span>' +
        '</summary>' +

          (ev.error ? '<div class="err-box">' + esc(ev.error) + '</div>' : '') +

  async function callCapture(method, body){
    if(!state.key) return;
    setError('cap-err');
    try{
      var headers = {'Authorization': 'Bearer ' + state.key, 'Accept': 'application/json'};
      var opts = {method: method, headers: headers};
      if(body !== undefined){
        headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      var resp = await fetch(DEBUG_CAPTURE_URL, opts);
      if(resp.status === 401 || resp.status === 403){
        showAuth('auth.denied', {status: resp.status});
        return;
      }
      var data = await resp.json();
      if(!resp.ok){
        setError('cap-err', 'capture.request_failed', {error: data.error || ('HTTP ' + resp.status)});
        return;
      }
      renderCapture(data);
    }catch(e){
      setError('cap-err', 'capture.request_failed', {error: e});
    }
  }

  window.loadCapture = function(unfold){
    if(unfold) setCardFold('capture', false);
    return callCapture('GET');
  };
  window.toggleCapture = function(){
    if(state.captureEnabled){ return callCapture('POST', {enabled: false}); }
    setCardFold('capture', false);
    var ttl = parseInt(document.getElementById('cap-ttl').value || '300', 10);
    return callCapture('POST', {enabled: true, ttl_seconds: ttl});
  };
  window.clearCapture = function(){
    state.openCaptures = {};
    return callCapture('DELETE');
  };

      mode: (document.getElementById('preview-mode') || {}).value || 'text'

    var model = ((document.getElementById('preview-model') || {}).value || '').trim();
    if(model) payload.model = model;
    var words = splitCSV((document.getElementById('preview-words') || {}).value);
    var allow = splitCSV((document.getElementById('preview-allow') || {}).value);
    var shapeEl = document.getElementById('preview-shape');
    if(words.length || allow.length || (shapeEl && shapeEl.checked)){
      payload.override = {};
      if(words.length) payload.override.words = words;
      if(allow.length) payload.override.allow = allow;
      if(shapeEl && shapeEl.checked) payload.override.shape = true;
    }
    state.previewPending = true;
    renderPreviewMeta();
    try{
      var resp = await fetch(PREVIEW_URL, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + state.key,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      if(resp.status === 401 || resp.status === 403){
        showAuth('auth.denied', {status: resp.status});
        return;
      }
      var data = await resp.json();
      state.lastPreview = resp.ok ? {data: data} : {error: {key: 'common.error', vars: {error: data.error || resp.status}}};
    }catch(e){
      state.lastPreview = {error: {key: 'preview.request_failed_help', vars: {endpoint: PREVIEW_URL, error: e}}};
    }finally{
      state.previewPending = false;
      if(state.lastPreview) renderPreview(state.lastPreview);
      else renderPreviewMeta();
    }
  };

  document.getElementById('auth-form').onsubmit = function(ev){
    ev.preventDefault();
    var val = document.getElementById('secret-input').value.trim();
    if(!val) return;
    state.key = val;
    try{ sessionStorage.setItem(KEY_STORAGE, val); }catch(_){}
    window.loadStatus();
  };

  var FOLD_STORAGE = 'cpa_reductant_collapsed_cards';
  function readFoldState(){
    try{
      var raw = localStorage.getItem(FOLD_STORAGE);
      return raw ? (JSON.parse(raw) || {}) : {};
    }catch(_){ return {}; }
  }
  function writeFoldState(map){
    try{ localStorage.setItem(FOLD_STORAGE, JSON.stringify(map)); }catch(_){}
  }
  function applyCardFold(card, collapsed){
    if(!card) return;
    card.classList.toggle('collapsed', !!collapsed);
    var btn = card.querySelector('.fold-btn');
    if(btn) btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
  }
  function setCardFold(id, collapsed){
    var card = document.querySelector('[data-fold="' + id + '"]');
    applyCardFold(card, collapsed);
    var map = readFoldState();
    if(collapsed) map[id] = true;
    else delete map[id];
    writeFoldState(map);
  }
  function initCardFolds(){
    var map = readFoldState();
    Array.prototype.forEach.call(document.querySelectorAll('[data-fold]'), function(card){
      var id = card.getAttribute('data-fold');
      applyCardFold(card, !!map[id]);
      var btn = card.querySelector('.fold-btn');
      if(btn){
        btn.onclick = function(){
          setCardFold(id, !card.classList.contains('collapsed'));
        };
      }
    });
  }
  initLanguage();
  initCardFolds();

  try{
    var saved = sessionStorage.getItem(KEY_STORAGE);
    if(saved){
      state.key = saved;
      window.loadStatus();
    }
  }catch(_){}
})();
</script>
</body>
</html>
